<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="progressbar.css">

</head>

<body>

<div id="container">

<svg
    id="progressSVG"
    viewBox="0 0 120 120"
    preserveAspectRatio="xMidYMid meet">

    <!-- Background -->
    <circle
        id="bg"
        cx="60"
        cy="60"
        r="46"/>
<circle
    id="innerRing"
    cx="60"
    cy="60"
    r="38"/>

    <!-- Progress Path -->
    <path
        id="progressPath"
        fill="none"/>

    <!-- Thumb -->
    <g id="thumb">

        <circle
            id="thumbCircle"
            r="6"/>


    </g>

</svg>

<div id="center">

<div id="percent">

65%

</div>

<div id="paid">

paid

</div>

</div>

</div>

<script src="progressbar.js"></script>

</body>

</html>
